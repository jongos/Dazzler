name: Dazzler checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install -r maintenance/requirements.txt
      - run: npm run format:check
      - run: python -m black --check tools tests skills/dazzler-frontend/scripts
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: python skills/dazzler-frontend/scripts/health.py
      - run: python tools/validate_fonts.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jongos/style-science
          ref: 443f60c05385284548369057fa10fd4e9f1450a9
          path: .upstream-style-science
      - run: python -O tools/vendor_gdc.py --source .upstream-style-science --check
      - run: python tools/validate_release.py
      - name: Require fresh gallery evidence for release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/validate_gallery_release.py maintenance/gallery-release.json
      - run: python tools/check_links.py
      - run: python tools/build_platforms.py --out dist/ci-platforms
      - run: python tools/validate_platforms.py dist/ci-platforms
      - run: python tools/claude_marketplace.py dist/ci-platforms --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-hashes-${{ matrix.os }}-${{ matrix.node }}
          path: dist/ci-platforms/SHA256SUMS.txt
  browser:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tools/test_font_loading.cjs dist/browser/fonts
      - run: node tools/test_visualization_exports.mjs dist/browser/visualizations
      - run: node tools/test_visualization_browser.cjs dist/browser/visualizations
      - run: node tools/test_hotspot_exports.mjs dist/browser/hotspots
      - run: node tools/test_hotspot_browser.cjs dist/browser/hotspots
      - run: node tools/test_native_hardening.cjs dist/browser/hotspots
      - run: node tools/test_signature_showcase.cjs dist/browser/signature
      - run: node tools/audit_palette_space.mjs dist/browser/palette-space
      - run: node tools/test_palette_space_browser.cjs dist/browser/palette-space
      - run: node tools/test_studio_browser.cjs dist/studio-browser
      - run: node tools/test_templates.cjs dist/browser --check-only
      - run: node tools/test_fieldguide.cjs dist/browser/fieldguide
      - run: node tools/test_template_gallery.cjs
      - run: python tools/recipe_smoke.py dist/browser/recipes
      - run: node tools/test_recipes_browser.cjs dist/browser/recipes
      - run: node tools/test_composition_browser.mjs dist/browser/composition
      - run: node tools/test_design_system_browser.mjs dist/browser/design-system
      - run: node tools/build_web_exploration.mjs dist/browser/web-exploration
      - run: node tools/test_web_exploration.cjs dist/browser/web-exploration
      - run: node tools/test_starters.cjs
      - run: node tools/test_handoff.mjs dist/browser/handoff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-review
          path: dist/browser
  reproducibility:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-hashes-*
          path: hashes
      - name: Compare all four platform builds
        run: |
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path("hashes").rglob("SHA256SUMS.txt"))
          assert len(files) == 4, files
          content = [p.read_text().splitlines() for p in files]
          assert all(value == content[0] for value in content), "Archive hashes differ across OS/Node versions"
          print("All four platform builds have identical hashes")
          PY
